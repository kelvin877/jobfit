[project]
name = "jobfit"
version = "0.1.0"
description = "Grounded job-posting vs. profile matching with Claude (RAG + structured outputs + evals)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kelvin Ling" }]
dependencies = ["anthropic>=2.0", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobfit = "jobfit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
